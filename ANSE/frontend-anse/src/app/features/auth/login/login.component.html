<div class="auth-container">
    <div class="auth-card">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Sistema de Gestión de Transporte ANSE</p>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            placeholder="Ingresa tu usuario"
            class="form-control"
            [class.is-invalid]="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched"
          />
        </div>
  
        <div class="form-group">
          <label for="contrasenia">Contraseña</label>
          <input
            id="contrasenia"
            type="password"
            formControlName="contrasenia"
            placeholder="Ingresa tu contraseña"
            class="form-control"
            [class.is-invalid]="loginForm.get('contrasenia')?.invalid && loginForm.get('contrasenia')?.touched"
          />
        </div>
  
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
  
        <button type="submit" class="btn-login" [disabled]="loginForm.invalid">
          Ingresar
        </button>
      </form>
  
      <p class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
      </p>
    </div>
  </div>
