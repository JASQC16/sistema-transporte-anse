<div class="container">
    <h2>{{ isEdit ? '✏️ Editar Ruta' : '➕ Nueva Ruta' }}</h2>
  
    <form [formGroup]="rutaForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-row">
        <div class="form-group half">
          <label for="origen">Origen *</label>
          <input
            id="origen"
            type="text"
            formControlName="origen"
            placeholder="Ciudad de origen"
            class="form-control"
            [class.is-invalid]="rutaForm.get('origen')?.invalid && rutaForm.get('origen')?.touched"
          />
          <div class="error-message" *ngIf="rutaForm.get('origen')?.invalid && rutaForm.get('origen')?.touched">
            <span *ngIf="rutaForm.get('origen')?.errors?.['required']">El origen es obligatorio.</span>
          </div>
        </div>
        <div class="form-group half">
          <label for="destino">Destino *</label>
          <input
            id="destino"
            type="text"
            formControlName="destino"
            placeholder="Ciudad de destino"
            class="form-control"
            [class.is-invalid]="rutaForm.get('destino')?.invalid && rutaForm.get('destino')?.touched"
          />
          <div class="error-message" *ngIf="rutaForm.get('destino')?.invalid && rutaForm.get('destino')?.touched">
            <span *ngIf="rutaForm.get('destino')?.errors?.['required']">El destino es obligatorio.</span>
          </div>
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group half">
          <label for="distanciaKm">Distancia (km) *</label>
          <input
            id="distanciaKm"
            type="number"
            step="0.01"
            formControlName="distanciaKm"
            placeholder="1000.50"
            class="form-control"
            [class.is-invalid]="rutaForm.get('distanciaKm')?.invalid && rutaForm.get('distanciaKm')?.touched"
          />
          <div class="error-message" *ngIf="rutaForm.get('distanciaKm')?.invalid && rutaForm.get('distanciaKm')?.touched">
            <span *ngIf="rutaForm.get('distanciaKm')?.errors?.['required']">La distancia es obligatoria.</span>
            <span *ngIf="rutaForm.get('distanciaKm')?.errors?.['min']">La distancia debe ser mayor a 0.</span>
          </div>
        </div>
        <div class="form-group half">
          <label for="tiempoEstimado">Tiempo Estimado *</label>
          <input
            id="tiempoEstimado"
            type="text"
            formControlName="tiempoEstimado"
            placeholder="14 horas, 2 días, etc."
            class="form-control"
            [class.is-invalid]="rutaForm.get('tiempoEstimado')?.invalid && rutaForm.get('tiempoEstimado')?.touched"
          />
          <div class="error-message" *ngIf="rutaForm.get('tiempoEstimado')?.invalid && rutaForm.get('tiempoEstimado')?.touched">
            <span *ngIf="rutaForm.get('tiempoEstimado')?.errors?.['required']">El tiempo estimado es obligatorio.</span>
          </div>
        </div>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="rutaForm.invalid">
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
