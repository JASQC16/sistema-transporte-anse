<div class="container">
    <div class="header">
      <h2>🗺️ Rutas</h2>
      <a *ngIf="isAdmin" routerLink="/rutas/nuevo" class="btn-primary">+ Nueva Ruta</a>
    </div>
  
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Distancia (km)</th>
            <th>Tiempo Estimado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rutas">
            <td>{{ r.id }}</td>
            <td>📍 {{ r.origen }}</td>
            <td>📍 {{ r.destino }}</td>
            <td>{{ r.distanciaKm }}</td>
            <td>{{ r.tiempoEstimado }}</td>
            <td class="actions-cell">
              <a *ngIf="isAdmin" [routerLink]="['/rutas/editar', r.id]" class="btn-edit">✏️ Editar</a>
              <button *ngIf="isAdmin" class="btn-delete" (click)="eliminar(r.id)">🗑️ Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
