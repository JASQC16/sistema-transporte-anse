<div class="container">
    <h2>{{ isEdit ? '✏️ Editar Vehículo' : '➕ Nuevo Vehículo' }}</h2>
  
    <form [formGroup]="vehiculoForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-row">
        <div class="form-group half">
          <label for="placa">Placa *</label>
          <input
            id="placa"
            type="text"
            formControlName="placa"
            placeholder="ABC-123"
            class="form-control"
            [class.is-invalid]="vehiculoForm.get('placa')?.invalid && vehiculoForm.get('placa')?.touched"
          />
          <div class="error-message" *ngIf="vehiculoForm.get('placa')?.invalid && vehiculoForm.get('placa')?.touched">
            <span *ngIf="vehiculoForm.get('placa')?.errors?.['required']">La placa es obligatoria.</span>
          </div>
        </div>
        <div class="form-group half">
          <label for="estado">Estado *</label>
          <select id="estado" formControlName="estado" class="form-control">
            <option value="Disponible">Disponible</option>
            <option value="Ocupado">Ocupado</option>
            <option value="En Mantenimiento">En Mantenimiento</option>
          </select>
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group half">
          <label for="marca">Marca *</label>
          <input
            id="marca"
            type="text"
            formControlName="marca"
            placeholder="Mercedes-Benz, Scania, etc."
            class="form-control"
            [class.is-invalid]="vehiculoForm.get('marca')?.invalid && vehiculoForm.get('marca')?.touched"
          />
          <div class="error-message" *ngIf="vehiculoForm.get('marca')?.invalid && vehiculoForm.get('marca')?.touched">
            <span *ngIf="vehiculoForm.get('marca')?.errors?.['required']">La marca es obligatoria.</span>
          </div>
        </div>
        <div class="form-group half">
          <label for="modelo">Modelo *</label>
          <input
            id="modelo"
            type="text"
            formControlName="modelo"
            placeholder="Actros 2545, R450, etc."
            class="form-control"
            [class.is-invalid]="vehiculoForm.get('modelo')?.invalid && vehiculoForm.get('modelo')?.touched"
          />
          <div class="error-message" *ngIf="vehiculoForm.get('modelo')?.invalid && vehiculoForm.get('modelo')?.touched">
            <span *ngIf="vehiculoForm.get('modelo')?.errors?.['required']">El modelo es obligatorio.</span>
          </div>
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group half">
          <label for="anio">Año *</label>
          <input
            id="anio"
            type="number"
            formControlName="anio"
            placeholder="2020"
            class="form-control"
            [class.is-invalid]="vehiculoForm.get('anio')?.invalid && vehiculoForm.get('anio')?.touched"
          />
          <div class="error-message" *ngIf="vehiculoForm.get('anio')?.invalid && vehiculoForm.get('anio')?.touched">
            <span *ngIf="vehiculoForm.get('anio')?.errors?.['required']">El año es obligatorio.</span>
            <span *ngIf="vehiculoForm.get('anio')?.errors?.['min'] || vehiculoForm.get('anio')?.errors?.['max']">
              Año entre 1950 y 2099.
            </span>
          </div>
        </div>
        <div class="form-group half">
          <label for="capacidad">Capacidad (toneladas) *</label>
          <input
            id="capacidad"
            type="number"
            step="0.01"
            formControlName="capacidad"
            placeholder="25.50"
            class="form-control"
            [class.is-invalid]="vehiculoForm.get('capacidad')?.invalid && vehiculoForm.get('capacidad')?.touched"
          />
          <div class="error-message" *ngIf="vehiculoForm.get('capacidad')?.invalid && vehiculoForm.get('capacidad')?.touched">
            <span *ngIf="vehiculoForm.get('capacidad')?.errors?.['required']">La capacidad es obligatoria.</span>
            <span *ngIf="vehiculoForm.get('capacidad')?.errors?.['min']">La capacidad debe ser mayor a 0.</span>
          </div>
        </div>
      </div>
  
      <div class="form-group">
        <label for="tipoCarga">Tipo de Carga *</label>
        <input
          id="tipoCarga"
          type="text"
          formControlName="tipoCarga"
          placeholder="Refrigerado, Carga Seca, etc."
          class="form-control"
          [class.is-invalid]="vehiculoForm.get('tipoCarga')?.invalid && vehiculoForm.get('tipoCarga')?.touched"
        />
        <div class="error-message" *ngIf="vehiculoForm.get('tipoCarga')?.invalid && vehiculoForm.get('tipoCarga')?.touched">
          <span *ngIf="vehiculoForm.get('tipoCarga')?.errors?.['required']">El tipo de carga es obligatorio.</span>
        </div>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="vehiculoForm.invalid">
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
