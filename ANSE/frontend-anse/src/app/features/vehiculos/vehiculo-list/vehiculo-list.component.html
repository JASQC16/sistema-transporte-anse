<div class="container">
    <div class="header">
      <h2>🚛 Vehículos</h2>
      <a *ngIf="isAdmin" routerLink="/vehiculos/nuevo" class="btn-primary">+ Nuevo Vehículo</a>
    </div>
  
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Año</th>
            <th>Capacidad</th>
            <th>Tipo Carga</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let v of vehiculos">
            <td>{{ v.id }}</td>
            <td><strong>{{ v.placa }}</strong></td>
            <td>{{ v.marca }}</td>
            <td>{{ v.modelo }}</td>
            <td>{{ v.anio }}</td>
            <td>{{ v.capacidad }} t</td>
            <td>{{ v.tipoCarga }}</td>
            <td>
              <span class="badge" [ngClass]="{
                'badge-success': v.estado === 'Disponible',
                'badge-warning': v.estado === 'En Mantenimiento',
                'badge-danger': v.estado === 'Ocupado'
              }">
                {{ v.estado }}
              </span>
            </td>
            <td class="actions-cell">
              <a *ngIf="isAdmin" [routerLink]="['/vehiculos/editar', v.id]" class="btn-edit">✏️ Editar</a>
              <button *ngIf="isAdmin" class="btn-delete" (click)="eliminar(v.id)">🗑️ Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
